<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀플 캘린더</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <p class="sub" style="margin-bottom:8px"><a href="./">← 홈</a></p>
  <h1 id="team-name">불러오는 중…</h1>
  <p class="sub">초대 코드 <span class="code" id="code"></span>
    <button class="ghost" id="copy">링크 복사</button></p>

  <!-- 참여 -->
  <div class="card" id="join-card" hidden>
    <h2>이 팀에 참여</h2>
    <form class="row" id="join">
      <input name="name" placeholder="내 이름" required maxlength="30">
      <button class="primary">참여</button>
    </form>
    <p class="msg" id="join-msg"></p>
  </div>

  <!-- 팀 겹쳐 보기 -->
  <div class="card">
    <h2>팀 전체 <span class="chips" id="members" style="display:inline-flex;margin-left:8px"></span></h2>
    <div id="team-grid"></div>
    <div class="legend">
      <span><i style="background:#d9f2e3"></i>모두 가능</span>
      <span><i style="background:#fde9c8"></i>1명 수업</span>
      <span><i style="background:#f8c9a6"></i>2명</span>
      <span><i style="background:#ee9d7e"></i>3명</span>
      <span><i style="background:#d9705b"></i>4명 이상</span>
    </div>
  </div>

  <!-- 공통 빈 시간 -->
  <div class="card">
    <h2>모일 수 있는 시간</h2>
    <div class="row" style="margin-bottom:12px">
      <label>최소 <select id="min-min">
        <option value="30">30분</option><option value="60" selected>1시간</option>
        <option value="90">1시간 30분</option><option value="120">2시간</option></select></label>
      <label>빠져도 되는 인원 <select id="max-absent">
        <option value="0" selected>0명</option><option value="1">1명</option><option value="2">2명</option></select></label>
      <label><input type="time" id="day-start" value="09:00"> ~ <input type="time" id="day-end" value="21:00"></label>
    </div>
    <ul class="free-list" id="free"></ul>
    <p class="msg" id="free-msg"></p>
  </div>

  <!-- 내 시간표 -->
  <div class="card" id="my-card" hidden>
    <h2>내 시간표 <small id="my-name" style="color:var(--muted);font-weight:400"></small></h2>
    <div class="tabs">
      <button class="on" data-tab="upload">이미지로 불러오기</button>
      <button data-tab="manual">직접 입력</button>
    </div>
    <div id="tab-upload">
      <div class="drop">
        <p>에브리타임 시간표 화면을 캡처해서 올려 주세요. (JPG/PNG)<br>
          <small>사진은 이 브라우저 안에서만 분석되고 서버로 전송되지 않습니다.</small></p>
        <div class="row" style="justify-content:center">
          <label>시간표 첫 줄 <select id="first-hour">
            <option value="8">8시</option><option value="9" selected>9시</option><option value="10">10시</option>
          </select></label>
          <input type="file" id="file" accept="image/*,.jpg,.jpeg,.png,.webp">
        </div>
      </div>
    </div>
    <div id="tab-manual" hidden>
      <p class="msg" style="margin:0 0 8px">아래 격자에서 <b>드래그</b>하면 수업이 추가됩니다. 정확한 시각은 이 양식으로 넣으세요.</p>
      <form class="row" id="add-slot">
        <input name="name" placeholder="과목명" required maxlength="50" style="width:160px">
        <select name="day">
          <option value="MON">월</option><option value="TUE">화</option><option value="WED">수</option>
          <option value="THU">목</option><option value="FRI">금</option><option value="SAT">토</option>
        </select>
        <input type="time" name="start" value="09:00" required>
        <span>~</span>
        <input type="time" name="end" value="10:00" required>
        <input name="location" placeholder="강의실(선택)" maxlength="50" style="width:120px">
        <button>추가</button>
      </form>
    </div>
    <p class="msg" id="my-msg"></p>

    <div id="my-grid" style="margin-top:8px"></div>
    <p class="legend">드래그: 수업 추가 · 블록 클릭: 이름 바꾸기 · ×: 삭제</p>

    <table class="slots" id="slot-table" hidden>
      <thead><tr><th>과목</th><th>요일</th><th>시간</th><th>강의실</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="save" disabled>저장</button>
      <span class="msg" id="save-msg" style="margin:0"></span>
      <span style="flex:1"></span>
      <button class="ghost" id="leave">팀 나가기</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/timetable.js"></script>
<script src="js/scheduler.js"></script>
<script>
const $ = (s) => document.querySelector(s);
// 초대 링크: team.html?c=CODE
const CODE = (new URLSearchParams(location.search).get("c") || "").trim().toUpperCase();
const DAYS = ["MON","TUE","WED","THU","FRI","SAT"];
const DAY_KO = {MON:"월",TUE:"화",WED:"수",THU:"목",FRI:"금",SAT:"토",SUN:"일"};
const COLORS = ["#4a7bd0","#d0674a","#3f9d6b","#8a5cc2","#c79a2a","#2a9bb0","#c2507a"];
const HOUR_PX = 40;
const { toMin, toHHMM: t2 } = TP_SCHEDULER;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const showError = (el, err) => { el.className = "msg error"; el.textContent = err.message || String(err); };

// ---- 내 멤버십 (브라우저에 저장) ----
const store = {
  all() { try { return JSON.parse(localStorage.getItem("tp.memberships") || "{}"); } catch { return {}; } },
  get() { return this.all()[CODE]; },
  set(m) { const a = this.all(); a[CODE] = m; try { localStorage.setItem("tp.memberships", JSON.stringify(a)); } catch {} },
  clear() { const a = this.all(); delete a[CODE]; try { localStorage.setItem("tp.memberships", JSON.stringify(a)); } catch {} },
};

let team = null;
let mySlots = [];      // 편집 중인 내 수업 목록
let dirty = false;

function fatal(message) {
  document.querySelector(".wrap").innerHTML = `<p class="msg error">${esc(message)}</p><p><a href="./">홈으로</a></p>`;
}

// ---- 로드 ----
async function load() {
  if (!CODE) return fatal("초대 코드가 없습니다.");
  try { team = await TP_API.getTeam(CODE); }
  catch (e) { return fatal(e.message); }
  if (!team) return fatal("팀을 찾을 수 없습니다. 초대 코드를 확인해 주세요.");

  document.title = `${team.name} · 팀플 캘린더`;
  $("#team-name").textContent = team.name;
  $("#code").textContent = team.code;

  let me = store.get();
  if (me && !team.members.some(m => m.id === me.id)) { store.clear(); me = null; }
  $("#join-card").hidden = !!me;
  $("#my-card").hidden = !me;
  if (me) {
    $("#my-name").textContent = me.name;
    if (!dirty) { mySlots = team.members.find(m => m.id === me.id).slots.map(s => ({...s})); renderMySlots(); }
  }

  $("#members").innerHTML = team.members.length
    ? team.members.map(m => `<span class="chip ${me && m.id === me.id ? "me" : ""}">${esc(m.name)}${m.slots.length ? "" : " (미입력)"}</span>`).join("")
    : `<span class="chip empty">아직 팀원이 없습니다</span>`;

  renderTeamGrid();
  renderFree();
}

// ---- 팀 겹쳐 보기 ----
function renderTeamGrid() {
  const ds = toMin($("#day-start").value || "09:00"), de = toMin($("#day-end").value || "21:00");
  const hours = (de - ds) / 60;
  const days = team.members.some(m => m.slots.some(s => s.day === "SAT")) ? DAYS : DAYS.slice(0, 5);
  let html = `<div class="grid" style="--days:${days.length}"><div class="head"></div>` +
    days.map(d => `<div class="head">${DAY_KO[d]}</div>`).join("");
  html += "<div>" + Array.from({length: Math.ceil(hours)}, (_, i) => `<div class="hour">${Math.floor(ds / 60) + i}</div>`).join("") + "</div>";
  for (const d of days) {
    html += `<div class="col" style="height:${hours * HOUR_PX}px">`;
    // 30분 칸마다 수업 중인 인원 수
    for (let t = ds; t < de; t += TP_SCHEDULER.STEP) {
      const busy = TP_SCHEDULER.busyAt(team.members, d, t);
      const cls = team.members.length === 0 ? "" : busy.length === 0 ? "free" : `b${Math.min(busy.length, 4)}`;
      const title = busy.length ? `${t2(t)} 수업 중: ${busy.join(", ")}` : `${t2(t)} 모두 가능`;
      html += `<div class="cell ${cls}" style="top:${(t - ds) / 60 * HOUR_PX}px;height:${HOUR_PX / 2}px" title="${esc(title)}"></div>`;
    }
    html += "</div>";
  }
  $("#team-grid").innerHTML = html + "</div>";
}

function renderFree() {
  const msg = $("#free-msg"); msg.className = "msg";
  if (!team.members.length) { $("#free").innerHTML = ""; msg.textContent = "팀원이 참여하면 여기에 모일 수 있는 시간이 표시됩니다."; return; }
  const list = TP_SCHEDULER.freeBlocks(team.members, {
    minMinutes: +$("#min-min").value, maxAbsent: +$("#max-absent").value,
    dayStart: $("#day-start").value || "09:00", dayEnd: $("#day-end").value || "21:00",
  });
  const missing = team.members.filter(m => !m.slots.length).map(m => m.name);
  msg.textContent = missing.length ? `${missing.join(", ")} 님은 아직 시간표를 입력하지 않아 항상 가능으로 계산됩니다.` : "";
  $("#free").innerHTML = list.length
    ? list.map(b => `<li><b>${DAY_KO[b.day]}</b> ${b.start} ~ ${b.end} <small>${b.minutes}분${b.absent.length ? " · 불참: " + esc(b.absent.join(", ")) : ""}</small></li>`).join("")
    : `<li>조건에 맞는 시간이 없습니다. 최소 시간을 줄이거나 빠져도 되는 인원을 늘려 보세요.</li>`;
}
["#min-min", "#max-absent", "#day-start", "#day-end"].forEach(s => $(s).addEventListener("change", () => { renderTeamGrid(); renderFree(); }));

// ---- 참여 / 나가기 ----
$("#join").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = e.target.name.value.trim();
  try {
    const m = await TP_API.joinTeam(CODE, name);
    store.set({ id: m.id, token: m.token, name: m.name, teamName: team.name });
    dirty = false; load();
  } catch (err) { showError($("#join-msg"), err); }
});
$("#leave").addEventListener("click", async () => {
  if (!confirm("팀에서 나가면 내 시간표도 삭제됩니다. 나갈까요?")) return;
  const me = store.get();
  try {
    await TP_API.leaveTeam(me.id, me.token);
    store.clear(); dirty = false; load();
  } catch (err) { showError($("#save-msg"), err); }
});
$("#copy").addEventListener("click", async () => {
  const link = `${location.origin}${location.pathname}?c=${CODE}`;
  try { await navigator.clipboard.writeText(link); $("#copy").textContent = "복사됨"; }
  catch { prompt("이 링크를 복사해서 팀원에게 보내세요", link); }
  setTimeout(() => $("#copy").textContent = "링크 복사", 1500);
});

// ---- 내 시간표 편집 ----
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  $("#tab-upload").hidden = b.dataset.tab !== "upload";
  $("#tab-manual").hidden = b.dataset.tab !== "manual";
}));

function renderMySlots() {
  const tb = $("#slot-table tbody");
  $("#slot-table").hidden = !mySlots.length;
  const color = {};
  mySlots.forEach(s => color[s.name] ??= COLORS[Object.keys(color).length % COLORS.length]);
  tb.innerHTML = mySlots
    .map((s, i) => ({ s, i }))
    .sort((a, b) => DAYS.indexOf(a.s.day) - DAYS.indexOf(b.s.day) || a.s.start.localeCompare(b.s.start))
    .map(({ s, i }) => `<tr>
      <td><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${color[s.name]};margin-right:6px"></i>${esc(s.name)}</td>
      <td>${DAY_KO[s.day]}</td><td>${s.start}~${s.end}</td><td>${esc(s.location || "")}</td>
      <td><button data-i="${i}">삭제</button></td></tr>`).join("");
  tb.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { mySlots.splice(+b.dataset.i, 1); markDirty(); }));
  $("#save").disabled = !dirty;
  renderMyGrid(color);
}

// ---- 내 시간표 격자 편집기 (드래그로 추가) ----
const SNAP_MIN = 15;
function renderMyGrid(color) {
  const days = mySlots.some(s => s.day === "SAT") ? DAYS : DAYS.slice(0, 5);
  let ds = 9 * 60, de = 21 * 60;
  mySlots.forEach(s => { ds = Math.min(ds, Math.floor(toMin(s.start) / 60) * 60); de = Math.max(de, Math.ceil(toMin(s.end) / 60) * 60); });
  const hours = (de - ds) / 60;
  let html = `<div class="grid editor" style="--days:${days.length}"><div class="head"></div>` +
    days.map(d => `<div class="head">${DAY_KO[d]}</div>`).join("");
  html += "<div>" + Array.from({length: hours}, (_, i) => `<div class="hour">${ds / 60 + i}</div>`).join("") + "</div>";
  for (const d of days) {
    html += `<div class="col" data-day="${d}" style="height:${hours * HOUR_PX}px">`;
    mySlots.forEach((s, i) => {
      if (s.day !== d) return;
      html += `<div class="slot" data-i="${i}" style="top:${(toMin(s.start) - ds) / 60 * HOUR_PX}px;height:${(toMin(s.end) - toMin(s.start)) / 60 * HOUR_PX}px;background:${color[s.name]}">
        <button class="x" data-i="${i}" title="삭제">×</button>${esc(s.name)}<small>${s.start}–${s.end}</small></div>`;
    });
    html += "</div>";
  }
  const box = $("#my-grid");
  box.innerHTML = html + "</div>";

  const yToMin = (col, clientY) => {
    const y = clientY - col.getBoundingClientRect().top;
    const m = ds + Math.round(y / HOUR_PX * 60 / SNAP_MIN) * SNAP_MIN;
    return Math.max(ds, Math.min(de, m));
  };
  box.querySelectorAll(".col").forEach(col => {
    col.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".slot")) return;
      e.preventDefault();
      col.setPointerCapture(e.pointerId);
      const from = yToMin(col, e.clientY);
      const ghost = document.createElement("div");
      ghost.className = "ghost";
      col.appendChild(ghost);
      let a = from, b = from;
      const draw = () => {
        ghost.style.top = `${(a - ds) / 60 * HOUR_PX}px`;
        ghost.style.height = `${(b - a) / 60 * HOUR_PX}px`;
        ghost.textContent = b > a ? `${t2(a)}–${t2(b)}` : "";
      };
      const move = (ev) => { const m = yToMin(col, ev.clientY); a = Math.min(from, m); b = Math.max(from, m); draw(); };
      const up = () => {
        col.removeEventListener("pointermove", move);
        ghost.remove();
        if (b - a >= SNAP_MIN) {
          mySlots.push({ name: `수업 ${mySlots.length + 1}`, day: col.dataset.day, start: t2(a), end: t2(b), location: null });
          markDirty();
        }
      };
      col.addEventListener("pointermove", move);
      col.addEventListener("pointerup", up, { once: true });
    });
  });
  box.querySelectorAll(".slot").forEach(el => el.addEventListener("click", (e) => {
    const i = +el.dataset.i;
    if (e.target.classList.contains("x")) { mySlots.splice(i, 1); markDirty(); return; }
    const name = prompt("과목명", mySlots[i].name);
    if (name && name.trim()) { mySlots[i].name = name.trim().slice(0, 50); markDirty(); }
  }));
}
function markDirty() { dirty = true; renderMySlots(); }

$("#add-slot").addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  if (toMin(f.end.value) <= toMin(f.start.value)) { showError($("#my-msg"), new Error("종료 시각이 시작보다 늦어야 합니다.")); return; }
  $("#my-msg").textContent = "";
  mySlots.push({ name: f.name.value.trim(), day: f.day.value, start: f.start.value, end: f.end.value, location: f.location.value.trim() || null });
  f.name.value = ""; f.location.value = "";
  markDirty();
});

$("#file").addEventListener("change", async (e) => {
  const file = e.target.files[0]; if (!file) return;
  const msg = $("#my-msg"); msg.className = "msg"; msg.textContent = "시간표를 읽는 중…";
  await new Promise(r => setTimeout(r, 30)); // 안내 문구가 먼저 그려지도록
  try {
    const r = await TP_TIMETABLE.extractTimetable(file, +$("#first-hour").value);
    mySlots = r.classes; markDirty();
    msg.innerHTML = `수업 ${r.classes.length}개를 찾았습니다. 아래 격자에서 시간을 확인하고, 과목명은 블록을 눌러 바꾼 뒤 저장해 주세요.` +
      r.warnings.map(w => `<br>⚠ ${esc(w)}`).join("");
  } catch (err) { showError(msg, err); }
  e.target.value = "";
});

$("#save").addEventListener("click", async () => {
  const me = store.get(); const msg = $("#save-msg"); msg.className = "msg";
  try {
    await TP_API.saveSlots(me.id, me.token, mySlots);
    dirty = false; msg.textContent = "저장했습니다."; load();
    setTimeout(() => msg.textContent = "", 2000);
  } catch (err) { showError(msg, err); }
});

// 다른 탭에서 돌아오면 팀원들이 바꾼 내용 다시 불러오기
document.addEventListener("visibilitychange", () => { if (!document.hidden && team) load(); });
window.addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });
load();
</script>
</body>
</html>
