<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>관리 · 팀플 캘린더</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <p class="sub" style="margin-bottom:8px"><a href="./">← 홈</a></p>
  <h1>관리</h1>
  <p class="sub">이용 현황을 보는 관리자용 화면입니다.</p>

  <div class="card" id="login">
    <h2>관리자 비밀번호</h2>
    <form class="row" id="login-form">
      <input type="password" id="pw" required autocomplete="current-password" aria-label="관리자 비밀번호" style="flex:1;min-width:200px">
      <button class="primary">열기</button>
    </form>
    <p class="msg" id="login-msg" role="status">비밀번호는 Supabase에서 정한 값입니다. 이 탭을 닫으면 다시 넣어야 합니다.</p>
  </div>

  <div id="stats" hidden>
    <div class="card">
      <div class="card-head">
        <h2>전체 <small class="h-sub" id="as-of"></small></h2>
        <button id="refresh">새로 고침</button>
      </div>
      <div class="stat-grid" id="totals"></div>
      <p class="msg">누적 이용자는 지금 남아 있는 팀원 수입니다. 팀을 나간 사람은 지워져서 빠집니다. 방문은 팀 페이지를 연 횟수이고, 방문 기록을 넣은 날부터 셉니다.</p>
    </div>

    <div class="card">
      <h2>최근 30일</h2>
      <div class="table-scroll">
        <table class="stats-table" id="daily">
          <thead><tr><th>날짜</th><th>새 팀</th><th>새 이용자</th><th>방문</th><th style="width:40%">방문 추이</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>최근 만들어진 팀 <small class="h-sub">최대 30개</small></h2>
      <div class="table-scroll">
        <table class="stats-table" id="teams">
          <thead><tr><th>팀 이름</th><th>코드</th><th>만든 날</th><th>팀원</th><th>방문</th><th>마지막 방문</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const md = (d) => { const [, m, day] = d.split("-").map(Number); return `${m}/${day}`; };
const KEY = "tp.admin"; // 비밀번호는 이 탭(sessionStorage)에만 둔다
let pw = "";
try { pw = sessionStorage.getItem(KEY) || ""; } catch {}

async function show() {
  const msg = $("#login-msg");
  msg.className = "msg"; msg.textContent = "불러오는 중…";
  let st;
  try { st = await TP_API.adminStats(pw); if (!st) throw new Error("통계를 불러오지 못했습니다. Supabase에서 스키마 SQL을 실행했는지 확인해 주세요."); }
  catch (err) {
    msg.className = "msg error"; msg.textContent = err.message;
    try { sessionStorage.removeItem(KEY); } catch {}
    $("#login").hidden = false; $("#stats").hidden = true;
    return;
  }
  try { sessionStorage.setItem(KEY, pw); } catch {}
  $("#login").hidden = true; $("#stats").hidden = false;

  const t = st.totals, rate = t.members ? Math.round(t.members_with_slots / t.members * 100) : 0;
  $("#as-of").textContent = `${st.today} 기준`;
  $("#totals").innerHTML = [
    ["누적 팀", t.teams], ["누적 이용자(팀원)", t.members], ["시간표 입력한 이용자", `${t.members_with_slots} (${rate}%)`],
    ["최근 7일 활동 팀", t.active_teams_7d], ["누적 방문", t.visits], ["모임 확정한 팀", t.confirmed_teams],
    ["등록된 일정", t.slots], ["모임 후보", t.options], ["투표", t.votes],
  ].map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("");

  const days = [...(st.daily || [])].reverse(); // 최근 날짜가 위로
  const max = Math.max(1, ...days.map(d => d.visits));
  $("#daily tbody").innerHTML = days.map(d => `<tr>
    <td>${md(d.day)}</td><td>${d.teams || ""}</td><td>${d.members || ""}</td><td>${d.visits || ""}</td>
    <td><i class="bar" style="width:${Math.round(d.visits / max * 100)}%"></i></td></tr>`).join("");

  $("#teams tbody").innerHTML = (st.recent_teams || []).map(x => `<tr>
    <td><a href="team.html?c=${encodeURIComponent(x.code)}">${esc(x.name)}</a>${x.read_only ? ` <span class="chip empty">읽기 전용</span>` : ""}</td>
    <td class="nowrap">${esc(x.code)}</td><td class="nowrap">${md(x.created)}</td><td>${x.members}</td><td>${x.visits}</td>
    <td class="nowrap">${x.last_visit ? md(x.last_visit) : "-"}</td></tr>`).join("")
    || `<tr><td colspan="6">아직 팀이 없습니다.</td></tr>`;
}

$("#login-form").addEventListener("submit", (e) => { e.preventDefault(); pw = $("#pw").value; show(); });
$("#refresh").addEventListener("click", show);
if (pw) show();
</script>
</body>
</html>
