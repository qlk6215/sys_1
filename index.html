<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팀플 캘린더</title>
<meta name="theme-color" content="#3b6fd6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="팀플캘린더">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <h1>팀플 캘린더</h1>
  <p class="sub">팀원 시간표를 모아서 모두 비는 시간을 찾아 줍니다.</p>

  <div class="card">
    <h2>새 팀 만들기</h2>
    <form class="row" id="create">
      <input name="name" placeholder="팀 이름 (예: 소프트웨어공학 3조)" required maxlength="50" style="flex:1;min-width:200px">
      <button class="primary">만들기</button>
    </form>
    <p class="msg" id="create-msg"></p>
  </div>

  <div class="card">
    <h2>초대 코드로 참여</h2>
    <form class="row" id="join">
      <input name="code" placeholder="코드 6자리" required maxlength="6" style="width:140px;text-transform:uppercase">
      <button>이동</button>
    </form>
    <p class="msg" id="join-msg"></p>

    <div id="recent" hidden>
      <h3 class="table-title">내 팀 <small>— 한 번 들어간 팀은 여기서 바로 들어갈 수 있어요</small></h3>
      <ul class="team-list" id="recent-list"></ul>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const teamUrl = (code) => `team.html?c=${encodeURIComponent(code)}`;

$("#create").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("#create-msg"); msg.className = "msg"; msg.textContent = "만드는 중…";
  try {
    const t = await TP_API.createTeam(e.target.name.value.trim());
    TP_STORE.rememberTeam(t.code, t.name);
    location.href = teamUrl(t.code);
  } catch (err) { msg.className = "msg error"; msg.textContent = err.message; }
});

$("#join").addEventListener("submit", async (e) => {
  e.preventDefault();
  const code = e.target.code.value.trim().toUpperCase();
  const msg = $("#join-msg"); msg.className = "msg"; msg.textContent = "";
  try {
    const t = await TP_API.getTeam(code);
    if (!t) throw new Error("팀을 찾을 수 없습니다. 초대 코드를 확인해 주세요.");
    TP_STORE.rememberTeam(t.code, t.name);
    location.href = teamUrl(code);
  } catch (err) { msg.className = "msg error"; msg.textContent = err.message; }
});

// 내 팀 목록 (이 브라우저에 저장)
function renderTeams() {
  const teams = TP_STORE.teams();
  $("#recent").hidden = !teams.length;
  $("#recent-list").innerHTML = teams.map(t => `<li>
    <a href="${teamUrl(t.code)}">
      <b>${esc(t.name || "이름 없는 팀")}</b>
      <span class="code-sm">${esc(t.code)}</span>
      ${t.me ? `<span class="chip me">${esc(t.me)}(으)로 참여 중</span>` : `<span class="chip empty">보기만 함</span>`}
    </a>
    ${t.me ? "" : `<button class="ghost" data-forget="${esc(t.code)}" title="목록에서 지우기">×</button>`}
  </li>`).join("");
  document.querySelectorAll("[data-forget]").forEach(b => b.addEventListener("click", () => {
    TP_STORE.forgetTeam(b.dataset.forget); renderTeams();
  }));
}
renderTeams();

if (!window.TP_CONFIG?.SUPABASE_URL) {
  $("#create-msg").className = "msg error";
  $("#create-msg").textContent = "js/config.js 에 Supabase URL과 키를 넣어야 사용할 수 있습니다.";
}
</script>
</body>
</html>
