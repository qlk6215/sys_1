<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팀플 캘린더</title>
<meta name="description" content="팀원 시간표를 모아 모두 비는 시간을 찾고, 투표로 모임을 정합니다. 무료, 가입 없음.">
<meta name="theme-color" content="#3b6fd6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="팀플캘린더">
<link rel="stylesheet" href="css/app.css">
<!-- 시작 애니메이션은 앱을 켠 첫 화면에서만: 같은 탭에서 홈으로 돌아올 때는 건너뛴다 -->
<script>try { if (sessionStorage.getItem("tp.splash")) document.documentElement.classList.add("no-splash"); sessionStorage.setItem("tp.splash", "1"); } catch {}</script>
</head>
<body>
<!-- 시작 화면: 아이콘이 나타나고 달력 칸이 채워진 뒤 CSS만으로 사라진다 (css/app.css .splash) -->
<div class="splash" aria-hidden="true">
  <svg viewBox="0 0 120 120" width="120" height="120">
    <rect class="sp-tile" width="120" height="120" rx="28" fill="#3b6fd6"/>
    <g class="sp-cal">
      <rect x="26" y="32" width="68" height="62" rx="9" fill="#fff"/>
      <rect x="26" y="32" width="68" height="14" rx="7" fill="#dfe8fb"/>
      <rect x="42" y="26" width="5" height="13" rx="2.5" fill="#dfe8fb"/>
      <rect x="73" y="26" width="5" height="13" rx="2.5" fill="#dfe8fb"/>
    </g>
    <rect class="sp-cell" style="--i:0" x="35" y="54" width="14" height="12" rx="3" fill="#f2a765"/>
    <rect class="sp-cell" style="--i:1" x="53" y="54" width="14" height="12" rx="3" fill="#4cb07a"/>
    <rect class="sp-cell" style="--i:2" x="71" y="54" width="14" height="12" rx="3" fill="#e3e8f2"/>
    <rect class="sp-cell" style="--i:3" x="35" y="72" width="14" height="12" rx="3" fill="#e3e8f2"/>
    <rect class="sp-cell" style="--i:4" x="53" y="72" width="14" height="12" rx="3" fill="#4cb07a"/>
    <rect class="sp-cell" style="--i:5" x="71" y="72" width="14" height="12" rx="3" fill="#f2a765"/>
  </svg>
</div>
<main class="home">
  <header class="brand">
    <img src="icons/icon-192.png" alt="" width="84" height="84">
    <h1>팀플 캘린더</h1>
    <p>팀원 시간표로 모두 비는 시간을 찾아요</p>
  </header>

  <div class="card">
    <div class="tabs" role="tablist">
      <button class="on" type="button" role="tab" aria-selected="true" data-tab="create">새 팀 만들기</button>
      <button type="button" role="tab" aria-selected="false" data-tab="join">코드로 들어가기</button>
    </div>

    <form class="stack" id="create">
      <label for="f-team">팀 이름</label>
      <input id="f-team" name="name" placeholder="예: 소프트웨어공학 3조" required maxlength="50" autocomplete="off">
      <button class="primary big">팀 만들기</button>
      <p class="msg" id="create-msg" role="status">만들면 6자리 초대 코드가 생겨요. 가입은 필요 없어요.</p>
    </form>

    <form class="stack" id="join" hidden>
      <label for="f-code">초대 코드 6자리</label>
      <input id="f-code" name="code" class="code-input" required maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="primary big">들어가기</button>
      <p class="msg" id="join-msg" role="status">팀원에게 받은 코드를 넣어 주세요.</p>
    </form>
  </div>

  <section id="recent" hidden>
    <h2 class="table-title">내 팀 <small>— 이 기기에서 들어간 팀</small></h2>
    <ul class="team-list" id="recent-list"></ul>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const teamUrl = (code) => `team.html?c=${encodeURIComponent(code)}`;
const say = (el, text, error) => { el.className = error ? "msg error" : "msg"; el.textContent = text; };

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-selected", x === b); });
  $("#create").hidden = b.dataset.tab !== "create";
  $("#join").hidden = b.dataset.tab !== "join";
  $(b.dataset.tab === "create" ? "#f-team" : "#f-code").focus();
}));

$("#create").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("#create-msg"); say(msg, "만드는 중…");
  try {
    const t = await TP_API.createTeam($("#f-team").value.trim());
    TP_STORE.rememberTeam(t.code, t.name);
    location.href = teamUrl(t.code);
  } catch (err) { say(msg, err.message, true); }
});

$("#join").addEventListener("submit", async (e) => {
  e.preventDefault();
  const code = $("#f-code").value.trim().toUpperCase();
  const msg = $("#join-msg"); say(msg, "팀을 찾는 중…");
  try {
    const t = await TP_API.getTeam(code);
    if (!t) throw new Error("팀을 찾을 수 없습니다. 초대 코드를 확인해 주세요.");
    TP_STORE.rememberTeam(t.code, t.name);
    location.href = teamUrl(code);
  } catch (err) { say(msg, err.message, true); }
});

// 내 팀 목록 (이 브라우저에 저장)
function renderTeams() {
  const teams = TP_STORE.teams();
  $("#recent").hidden = !teams.length;
  $("#recent-list").innerHTML = teams.map(t => `<li>
    <a href="${teamUrl(t.code)}">
      <b>${esc(t.name || "이름 없는 팀")}</b>
      <span class="code-sm">${esc(t.code)}</span>
      ${t.me ? `<span class="chip me">${esc(t.me)}(으)로 참여 중</span>` : `<span class="chip empty">보기만 함</span>`}
    </a>
    ${t.me ? "" : `<button class="ghost" data-forget="${esc(t.code)}" aria-label="${esc(t.name || t.code)} 목록에서 지우기">×</button>`}
  </li>`).join("");
  document.querySelectorAll("[data-forget]").forEach(b => b.addEventListener("click", () => {
    TP_STORE.forgetTeam(b.dataset.forget); renderTeams();
  }));
}
renderTeams();

if (!window.TP_CONFIG?.SUPABASE_URL) say($("#create-msg"), "js/config.js 에 Supabase URL과 키를 넣어야 사용할 수 있습니다.", true);
</script>
</body>
</html>
